name: Apply validated R2R responsiveness

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/export-responsive-index.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          show-progress: false
          ref: ${{ github.head_ref }}

      - name: Apply responsive CSS without changing content
        shell: bash
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); b=Path('.r2r-responsive.css').read_text(); m='  </style>'; assert s.count(m)==1; assert 'Ajustes responsivos: preservam o layout' not in s; p.write_text(s.replace(m,b+m,1))"
          grep -q "Ajustes responsivos: preservam o layout" index.html
          rm -f .r2r-responsive.css
          rm -f .github/workflows/export-responsive-index.yml

      - name: Commit isolated responsive correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html .r2r-responsive.css .github/workflows/export-responsive-index.yml
          git commit -m "Configura responsividade preservando o layout atual"
          git push origin HEAD:${{ github.head_ref }}
