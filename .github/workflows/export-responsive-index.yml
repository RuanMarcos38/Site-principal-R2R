name: Export responsive R2R index

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/export-responsive-index.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          show-progress: false
          ref: ${{ github.head_ref }}

      - uses: actions/upload-artifact@v4
        with:
          name: r2r-responsive-index
          path: index.html
          if-no-files-found: error
          retention-days: 1
