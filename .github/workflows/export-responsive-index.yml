name: Apply validated R2R responsiveness

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/export-responsive-index.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          show-progress: false
          ref: ${{ github.head_ref }}

      - name: Apply responsive CSS without changing content
        shell: bash
        run: |
          set -euo pipefail
          echo "d4b81e4f7090702fb82d259c5031dbdfae71353a14d185e99a732a9d589ca6ac  index.html" | sha256sum --check
          printf '%s' '' | base64 --decode > /tmp/responsive-block.css
          echo "9f0901c58b070621c22ec9db1facb40747f0d3835ea1a99529843432f62b4bb8  /tmp/responsive-block.css" | sha256sum --check
          python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); m='  </style>'; b=Path('/tmp/responsive-block.css').read_text(); assert s.count(m)==1; assert 'Ajustes responsivos: preservam o layout' not in s; p.write_text(s.replace(m,b+m,1))"
          echo "f0b4fa689470b97cfb672097f44422874eb945589f197de39f60d9a226a5c9ce  index.html" | sha256sum --check
          rm -f .github/workflows/export-responsive-index.yml

      - name: Commit isolated responsive correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html .github/workflows/export-responsive-index.yml
          git commit -m "Configura responsividade preservando o layout atual"
          git push origin HEAD:${{ github.head_ref }}
