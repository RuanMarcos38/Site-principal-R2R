name: Diagnose index package final

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/replace-index.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          show-progress: false
          ref: ${{ github.head_ref }}

      - name: Validate package parts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            echo "PARTES:"
            for file in .r2r-index-parts/part-*.b64; do
              printf '%s ' "$(basename "$file")"
              wc -c < "$file" | tr -d '\n'
              printf ' '
              sha256sum "$file" | cut -d' ' -f1
            done
            cat .r2r-index-parts/part-*.b64 > /tmp/r2r-index.b64
            echo "BASE64_TOTAL $(wc -c < /tmp/r2r-index.b64) $(sha256sum /tmp/r2r-index.b64 | cut -d' ' -f1)"
            base64 --decode /tmp/r2r-index.b64 > /tmp/r2r-index.html.gz 2>/tmp/base64-error.txt
            echo "BASE64_STATUS $?"
            cat /tmp/base64-error.txt
            gzip --test /tmp/r2r-index.html.gz 2>/tmp/gzip-test-error.txt
            echo "GZIP_TEST_STATUS $?"
            cat /tmp/gzip-test-error.txt
            gzip --decompress --stdout /tmp/r2r-index.html.gz > /tmp/index.html 2>/tmp/gzip-error.txt
            echo "GZIP_STATUS $?"
            cat /tmp/gzip-error.txt
            echo "INDEX $(wc -c < /tmp/index.html) $(sha256sum /tmp/index.html | cut -d' ' -f1)"
          } > /tmp/report.txt 2>&1
          REPORT=$(cat /tmp/report.txt)
          gh pr comment "${{ github.event.pull_request.number }}" --body "### Validação final das partes do index\n\n\`\`\`text\n${REPORT}\n\`\`\`"
          cat /tmp/report.txt
