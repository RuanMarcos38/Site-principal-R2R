name: Replace index from uploaded design

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/replace-index.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          show-progress: false
          ref: ${{ github.head_ref }}

      - name: Rebuild and validate index.html
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          cat .r2r-index-parts/part-*.b64 > /tmp/r2r-index.b64
          ORIGINAL_SIZE=$(wc -c < /tmp/r2r-index.b64)
          PADDING=$(( (4 - (ORIGINAL_SIZE % 4)) % 4 ))
          if [ "$PADDING" -gt 0 ]; then
            printf '%*s' "$PADDING" '' | tr ' ' '=' >> /tmp/r2r-index.b64
          fi
          PADDED_SIZE=$(wc -c < /tmp/r2r-index.b64)
          base64 --decode /tmp/r2r-index.b64 > /tmp/r2r-index.html.gz 2>/tmp/base64-error.txt
          BASE64_STATUS=$?
          gzip --test /tmp/r2r-index.html.gz 2>/tmp/gzip-test-error.txt
          GZIP_TEST_STATUS=$?
          gzip --decompress --stdout /tmp/r2r-index.html.gz > index.html 2>/tmp/gzip-error.txt
          GZIP_STATUS=$?
          GENERATED_SHA=$(sha256sum index.html | cut -d' ' -f1)
          if [ "$GENERATED_SHA" = "b7ca10e0e8a8c1bf5e68b6267ad8e6536fa8c20f7b64b90d8b3819a6c10d8d39" ]; then
            HASH_STATUS=0
          else
            HASH_STATUS=1
          fi
          {
            echo "Tamanho original: ${ORIGINAL_SIZE}"
            echo "Padding adicionado: ${PADDING}"
            echo "Tamanho após padding: ${PADDED_SIZE}"
            echo "Status base64: ${BASE64_STATUS}"
            cat /tmp/base64-error.txt
            echo "Status teste gzip: ${GZIP_TEST_STATUS}"
            cat /tmp/gzip-test-error.txt
            echo "Status descompressão: ${GZIP_STATUS}"
            cat /tmp/gzip-error.txt
            echo "SHA gerado: ${GENERATED_SHA}"
            echo "Status hash: ${HASH_STATUS}"
          } > /tmp/r2r-report.txt
          REPORT=$(cat /tmp/r2r-report.txt)
          gh pr comment "${{ github.event.pull_request.number }}" --body "### Validação da reconstrução\n\n\`\`\`text\n${REPORT}\n\`\`\`"
          cat /tmp/r2r-report.txt
          if [ "$BASE64_STATUS" -ne 0 ] || [ "$GZIP_TEST_STATUS" -ne 0 ] || [ "$GZIP_STATUS" -ne 0 ] || [ "$HASH_STATUS" -ne 0 ]; then
            exit 1
          fi
          rm -rf .r2r-index-parts
          rm -f .github/workflows/replace-index.yml

      - name: Commit replacement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html .r2r-index-parts .github/workflows/replace-index.yml
          git commit -m "Atualiza index.html conforme layout anexado"
          git push origin HEAD:${{ github.head_ref }}
