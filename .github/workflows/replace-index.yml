name: Replace index from uploaded design

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/replace-index.yml'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          show-progress: false
          ref: ${{ github.head_ref }}

      - name: Rebuild and validate index.html
        shell: bash
        run: |
          set -euo pipefail
          cat .r2r-index-parts/part-*.b64 > /tmp/r2r-index.b64
          BASE64_SIZE=$(wc -c < /tmp/r2r-index.b64)
          PADDING=$(( (4 - (BASE64_SIZE % 4)) % 4 ))
          if [ "$PADDING" -gt 0 ]; then
            printf '%*s' "$PADDING" '' | tr ' ' '=' >> /tmp/r2r-index.b64
          fi
          base64 --decode /tmp/r2r-index.b64 > /tmp/r2r-index.html.gz
          gzip --test /tmp/r2r-index.html.gz
          gzip --decompress --stdout /tmp/r2r-index.html.gz > index.html
          echo "b7ca10e0e8a8c1bf5e68b6267ad8e6536fa8c20f7b64b90d8b3819a6c10d8d39  index.html" | sha256sum --check
          rm -rf .r2r-index-parts
          rm -f .github/workflows/replace-index.yml

      - name: Commit replacement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html .r2r-index-parts .github/workflows/replace-index.yml
          git commit -m "Atualiza index.html conforme layout anexado"
          git push origin HEAD:${{ github.head_ref }}
