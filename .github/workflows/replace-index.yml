name: Apply validated R2R index

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/replace-index.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          show-progress: false
          ref: ${{ github.head_ref }}

      - name: Rebuild and validate only index.html
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          path = Path('.r2r-index-parts/part-011a.b64')
          data = path.read_text()
          if len(data) != 8000:
              raise SystemExit(f'Tamanho inesperado: {len(data)}')
          if data[213] != 'a':
              raise SystemExit(f'Caractere inesperado na posição 213: {data[213]!r}')
          path.write_text(data[:213] + 'e' + data[214:])
          PY

          echo "0af9f01e1fdac08dcf6a2a29d49b3115cf49d956eda700c16842ea8135409272  .r2r-index-parts/part-011a.b64" | sha256sum --check
          echo "7aa0b9d09025701571df2469a397f6c335e18729216638128b3709da0af4ff07  .r2r-index-parts/part-011b.b64" | sha256sum --check

          cat .r2r-index-parts/part-*.b64 > /tmp/r2r-index.b64
          echo "d99d867ddcd4dcfe44344520623fa98a8e4c058fcc9906b5b05c3033f2489d44  /tmp/r2r-index.b64" | sha256sum --check

          base64 --decode /tmp/r2r-index.b64 > /tmp/r2r-index.html.gz
          echo "5a9ff28ab822c8b9beeac2789c89fdd848143cdf9feb07e1f53a84f62bcc1cd8  /tmp/r2r-index.html.gz" | sha256sum --check
          gzip --test /tmp/r2r-index.html.gz
          gzip --decompress --stdout /tmp/r2r-index.html.gz > index.html
          echo "b7ca10e0e8a8c1bf5e68b6267ad8e6536fa8c20f7b64b90d8b3819a6c10d8d39  index.html" | sha256sum --check

          rm -rf .r2r-index-parts
          rm -f .github/workflows/replace-index.yml

      - name: Commit isolated replacement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html .r2r-index-parts .github/workflows/replace-index.yml
          git commit -m "Atualiza somente o index.html conforme layout anexado"
          git push origin HEAD:${{ github.head_ref }}
