name: Export index diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/replace-index.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          show-progress: false
          ref: ${{ github.head_ref }}

      - name: Prepare diagnostic files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r2r-diagnostic
          cp .r2r-index-parts/part-011a.b64 /tmp/r2r-diagnostic/
          cp .r2r-index-parts/part-011b.b64 /tmp/r2r-diagnostic/
          cat .r2r-index-parts/part-*.b64 > /tmp/r2r-diagnostic/combined.b64
          base64 --decode /tmp/r2r-diagnostic/combined.b64 > /tmp/r2r-diagnostic/index.html.gz
          gzip --decompress --stdout /tmp/r2r-diagnostic/index.html.gz > /tmp/r2r-diagnostic/generated-index.html || true

      - uses: actions/upload-artifact@v4
        with:
          name: r2r-index-diagnostic
          path: /tmp/r2r-diagnostic
          if-no-files-found: error
          retention-days: 1
